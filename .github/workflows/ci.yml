name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble Debug APK
        run: ./gradlew :app:assembleDebug

      - name: Run Unit Tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Run Lint
        run: ./gradlew :app:lintDebug --rerun-tasks

      - name: Verify APK archives and create checksums
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/debug/*.apk)
          if (( ${#apks[@]} == 0 )); then
            echo "No debug APKs were produced." >&2
            exit 1
          fi
          mkdir -p artifact
          : > artifact/SHA256SUMS.txt
          for apk in "${apks[@]}"; do
            echo "Checking APK archive: $apk"
            unzip -t "$apk"
            cp "$apk" artifact/
            (cd artifact && sha256sum "$(basename "$apk")") >> artifact/SHA256SUMS.txt
          done
          cat artifact/SHA256SUMS.txt

      - name: Upload Debug APKs without recompression
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: artifact/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Download uploaded artifact for round-trip verification
        uses: actions/download-artifact@v4
        with:
          name: debug-apk
          path: artifact-roundtrip

      - name: Verify downloaded artifact integrity
        shell: bash
        run: |
          set -euo pipefail
          cd artifact-roundtrip
          sha256sum --check SHA256SUMS.txt
          shopt -s nullglob
          apks=(*.apk)
          if (( ${#apks[@]} == 0 )); then
            echo "Downloaded artifact contains no APK files." >&2
            exit 1
          fi
          for apk in "${apks[@]}"; do
            unzip -t "$apk"
          done
